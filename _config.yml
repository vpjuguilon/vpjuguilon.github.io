title: "Vince Paul Juguilon"
tagline: "Physics · Data · Patents"
description: >-
  Multidisciplinary professional and Physics PhD candidate with expertise 
  at the intersection of experimental physics, data science, and intellectual property.

# TODO: replace with your actual custom domain once you have one,
# or leave as-is for the default vpjuguilon.github.io address.
url: "https://vpjuguilon.github.io"
baseurl: ""

author:
  name: "Vince Paul Juguilon"
  github: vpjuguilon
  # linkedin: "https://www.linkedin.com/in/yourprofile"   # TODO: uncomment & fill in
  # email: "you@example.com"                              # TODO: uncomment & fill in

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
